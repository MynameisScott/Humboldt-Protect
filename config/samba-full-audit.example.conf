# Referencia para Samba vfs_full_audit.
# Em OpenMediaVault, prefira configurar pelo mecanismo suportado pelo OMV,
# pois edicoes manuais no smb.conf podem ser sobrescritas.
#
# O detector espera prefixo contendo, nesta ordem:
# usuario | IP | compartilhamento
#
# Exemplo conceitual por share:
#   vfs objects = full_audit
#   full_audit:prefix = %u|%I|%S
#   full_audit:success = mkdirat renameat unlinkat pwrite write pwrite_recv offload_read_send offload_read_recv offload_write_send offload_write_recv
#   full_audit:failure = none
#   full_audit:facility = LOCAL7
#   full_audit:priority = NOTICE
#
# Ajuste conforme a versao do Samba/OMV em uso e valide com testparm.
